name: Stable release gate

'on':
  workflow_call:
    inputs:
      tag:
        description: Stable tag vX.Y.Z pointing to the caller's commit.
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

jobs:
  gate:
    # Preview tags never publish to registries. The publication workflow in #36
    # must depend on this gate, including the asset hash comparison, succeeding.
    # A reusable workflow inherits its caller's event; the declared input
    # distinguishes calls even when the caller was triggered by a push.
    if: github.event_name == 'push' || contains(toJSON(inputs), '"tag"')
    env:
      IS_REUSABLE_CALL: ${{ contains(toJSON(inputs), '"tag"') }}
      STABLE_TAG: ${{ !contains(toJSON(inputs), '"tag"') && github.ref_name || inputs.tag }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify stable tag commit
        id: tag
        shell: bash
        run: bash scripts/verify-stable-tag.sh
      - uses: actions/setup-go@v7
        if: steps.tag.outputs.preview != 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Build stable binaries
        if: steps.tag.outputs.preview != 'true'
        shell: bash
        run: |
          bash scripts/release.sh "${STABLE_TAG#v}" "$RUNNER_TEMP/stable-release"
      - name: Require a validated preview on this commit
        if: steps.tag.outputs.preview != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version_output=$("$RUNNER_TEMP/stable-release/sandboxed-agents-linux-amd64" version)
          asset_hash=$(printf '%s\n' "$version_output" | awk '$1 == "asset-sha256" { print $2 }')
          go run ./internal/release/cmd/stable-gate \
            --tag "$STABLE_TAG" --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --asset-hash "$asset_hash"
