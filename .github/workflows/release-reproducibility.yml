name: Release reproducibility

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RELEASE_VERSION: 0.0.0-ci-${{ github.sha }}

jobs:
  # The decision runs once, so the Linux and Windows jobs can start together.
  changes:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      run_checks: ${{ steps.changes.outputs.run_checks }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether full checks are required
        id: changes
        shell: bash
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-checks-required.sh >> "$GITHUB_OUTPUT"

  linux:
    needs: changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      linux_asset_hash: ${{ steps.version.outputs.linux_asset_hash }}
      linux_sha256: ${{ steps.version.outputs.linux_sha256 }}
      windows_sha256: ${{ steps.version.outputs.windows_sha256 }}
      npm_sha256: ${{ steps.version.outputs.npm_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether full checks are required
        id: changes
        shell: bash
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-checks-required.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        if: steps.changes.outputs.run_checks == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.run_checks == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Tag the runner checkout
        if: steps.changes.outputs.run_checks == 'true'
        shell: bash
        run: git tag "v$RELEASE_VERSION" HEAD
      - name: Run the offline suite
        if: steps.changes.outputs.run_checks == 'true'
        run: go test ./... -count=1
      - name: Build releases and report Linux version
        if: steps.changes.outputs.run_checks == 'true'
        id: version
        shell: bash
        run: |
          bash scripts/release.sh "$RELEASE_VERSION" "$RUNNER_TEMP/release-output"
          version_output=$("$RUNNER_TEMP/release-output/sandboxed-agents-linux-amd64" version)
          printf '%s\n' "$version_output"
          asset_hash=$(printf '%s\n' "$version_output" | awk '$1 == "asset-sha256" { print $2 }')
          [[ $asset_hash =~ ^[0-9a-f]{64}$ ]]
          printf 'linux_asset_hash=%s\n' "$asset_hash" >> "$GITHUB_OUTPUT"
          linux_sha256=$(sha256sum "$RUNNER_TEMP/release-output/sandboxed-agents-linux-amd64" | awk '{ print $1 }')
          [[ $linux_sha256 =~ ^[0-9a-f]{64}$ ]]
          printf 'Linux executable SHA256: %s\n' "$linux_sha256"
          printf 'linux_sha256=%s\n' "$linux_sha256" >> "$GITHUB_OUTPUT"
          windows_sha256=$(sha256sum "$RUNNER_TEMP/release-output/sandboxed-agents-windows-amd64.exe" | awk '{ print $1 }')
          [[ $windows_sha256 =~ ^[0-9a-f]{64}$ ]]
          printf 'Windows executable SHA256: %s\n' "$windows_sha256"
          printf 'windows_sha256=%s\n' "$windows_sha256" >> "$GITHUB_OUTPUT"
          npm_sha256=$(sha256sum "$RUNNER_TEMP/release-output/sandboxed-agents-$RELEASE_VERSION.tgz" | awk '{ print $1 }')
          [[ $npm_sha256 =~ ^[0-9a-f]{64}$ ]]
          printf 'npm tarball SHA256: %s\n' "$npm_sha256"
          printf 'npm_sha256=%s\n' "$npm_sha256" >> "$GITHUB_OUTPUT"

  windows:
    needs: changes
    if: needs.changes.outputs.run_checks == 'true'
    runs-on: blacksmith-2vcpu-windows-2025
    outputs:
      windows_asset_hash: ${{ steps.version.outputs.windows_asset_hash }}
      linux_sha256: ${{ steps.version.outputs.linux_sha256 }}
      windows_sha256: ${{ steps.version.outputs.windows_sha256 }}
      npm_sha256: ${{ steps.version.outputs.npm_sha256 }}
    env:
      SANDBOXED_AGENTS_RELEASE_BASH: 'C:\Program Files\Git\bin\bash.exe'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify LF Go sources with Windows checkout settings and tag HEAD
        shell: pwsh
        run: |
          git config core.autocrlf true
          if ($LASTEXITCODE -ne 0) { throw 'Local CRLF configuration failed' }
          git read-tree --empty
          if ($LASTEXITCODE -ne 0) { throw 'CI index invalidation failed' }
          git -c core.autocrlf=true reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { throw 'CRLF checkout rematerialization failed' }
          $sources = Get-ChildItem -Recurse -Filter '*.go'
          if ($sources.Count -eq 0) { throw 'No Go sources found' }
          foreach ($source in $sources) {
            $contents = [System.IO.File]::ReadAllText($source.FullName)
            if ($contents.Contains("`r`n")) { throw "Go source contains CRLF: $($source.FullName)" }
          }
          $unformatted = @(gofmt -l .)
          if ($LASTEXITCODE -ne 0) { throw 'Go formatting check failed' }
          if ($unformatted.Count -ne 0) { throw "Go sources need formatting: $($unformatted -join ', ')" }
          git tag "v$env:RELEASE_VERSION" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Local CI tag failed' }
      - name: Run CLI and stable gate tests
        shell: pwsh
        run: |
          go test ./cmd/sandboxed-agents ./internal/cli ./internal/release/cmd/stable-gate -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Windows command, CLI, or stable gate tests failed' }
      - name: Run image and release tests with Git for Windows Bash
        shell: pwsh
        env:
          SANDBOXED_AGENTS_TEST_HKCU: '1'
        run: |
          go test ./image ./scripts -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows image or release tests failed' }
      - name: Build releases and report Windows version
        id: version
        shell: pwsh
        run: |
          $outputDirectory = "$env:RUNNER_TEMP/release-output".Replace('\', '/')
          & $env:SANDBOXED_AGENTS_RELEASE_BASH scripts/release.sh $env:RELEASE_VERSION $outputDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed' }
          $versionOutput = & "$env:RUNNER_TEMP/release-output/sandboxed-agents-windows-amd64.exe" version
          if ($LASTEXITCODE -ne 0) { throw 'Windows version failed' }
          $versionOutput
          if ($versionOutput[0] -ne "sandboxed-agents $env:RELEASE_VERSION") { throw 'Injected Windows version differs' }
          $assetHash = ($versionOutput | Where-Object { $_ -match '^asset-sha256 ' }) -replace '^asset-sha256 ', ''
          if ($assetHash -notmatch '^[0-9a-f]{64}$') { throw 'Windows asset hash missing' }
          $windowsSHA256 = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP/release-output/sandboxed-agents-windows-amd64.exe").Hash.ToLowerInvariant()
          "Windows executable SHA256: $windowsSHA256"
          $linuxSHA256 = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP/release-output/sandboxed-agents-linux-amd64").Hash.ToLowerInvariant()
          "Linux executable SHA256: $linuxSHA256"
          $npmSHA256 = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP/release-output/sandboxed-agents-$env:RELEASE_VERSION.tgz").Hash.ToLowerInvariant()
          "npm tarball SHA256: $npmSHA256"
          "windows_asset_hash=$assetHash" >> $env:GITHUB_OUTPUT
          "windows_sha256=$windowsSHA256" >> $env:GITHUB_OUTPUT
          "linux_sha256=$linuxSHA256" >> $env:GITHUB_OUTPUT
          "npm_sha256=$npmSHA256" >> $env:GITHUB_OUTPUT

  compare:
    needs: [linux, windows]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      LINUX_ASSET_HASH: ${{ needs.linux.outputs.linux_asset_hash }}
      LINUX_LINUX_SHA256: ${{ needs.linux.outputs.linux_sha256 }}
      LINUX_WINDOWS_SHA256: ${{ needs.linux.outputs.windows_sha256 }}
      LINUX_NPM_SHA256: ${{ needs.linux.outputs.npm_sha256 }}
      WINDOWS_ASSET_HASH: ${{ needs.windows.outputs.windows_asset_hash }}
      WINDOWS_LINUX_SHA256: ${{ needs.windows.outputs.linux_sha256 }}
      WINDOWS_WINDOWS_SHA256: ${{ needs.windows.outputs.windows_sha256 }}
      WINDOWS_NPM_SHA256: ${{ needs.windows.outputs.npm_sha256 }}
    steps:
      - name: Compare asset hash and both executable digests
        shell: bash
        run: |
          compare() {
            printf '%s: Linux %s, Windows %s\n' "$1" "$2" "$3"
            [[ $2 =~ ^[0-9a-f]{64}$ && $2 == "$3" ]] || { printf '%s differs between the runners\n' "$1" >&2; exit 1; }
          }
          compare 'asset hash' "$LINUX_ASSET_HASH" "$WINDOWS_ASSET_HASH"
          compare 'Windows executable SHA256' "$LINUX_WINDOWS_SHA256" "$WINDOWS_WINDOWS_SHA256"
          compare 'Linux executable SHA256' "$LINUX_LINUX_SHA256" "$WINDOWS_LINUX_SHA256"
          compare 'npm tarball SHA256' "$LINUX_NPM_SHA256" "$WINDOWS_NPM_SHA256"
