name: Release reproducibility

'on':
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_VERSION: 0.0.0-ci-${{ github.sha }}

jobs:
  linux:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      linux_asset_hash: ${{ steps.version.outputs.linux_asset_hash }}
      linux_sha256: ${{ steps.version.outputs.linux_sha256 }}
      windows_sha256: ${{ steps.version.outputs.windows_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Tag the runner checkout
        shell: bash
        run: git tag "v$RELEASE_VERSION" HEAD
      - name: Run the offline suite
        run: go test ./... -count=1
      - name: Build releases and report Linux version
        id: version
        shell: bash
        run: |
          bash scripts/release.sh "$RELEASE_VERSION" "$RUNNER_TEMP/release-output"
          version_output=$("$RUNNER_TEMP/release-output/sandboxed-agents-linux-amd64" version)
          printf '%s\n' "$version_output"
          asset_hash=$(printf '%s\n' "$version_output" | awk '$1 == "asset-sha256" { print $2 }')
          [[ $asset_hash =~ ^[0-9a-f]{64}$ ]]
          printf 'linux_asset_hash=%s\n' "$asset_hash" >> "$GITHUB_OUTPUT"
          linux_sha256=$(sha256sum "$RUNNER_TEMP/release-output/sandboxed-agents-linux-amd64" | awk '{ print $1 }')
          [[ $linux_sha256 =~ ^[0-9a-f]{64}$ ]]
          printf 'Linux executable SHA256: %s\n' "$linux_sha256"
          printf 'linux_sha256=%s\n' "$linux_sha256" >> "$GITHUB_OUTPUT"
          windows_sha256=$(sha256sum "$RUNNER_TEMP/release-output/sandboxed-agents-windows-amd64.exe" | awk '{ print $1 }')
          [[ $windows_sha256 =~ ^[0-9a-f]{64}$ ]]
          printf 'Windows executable SHA256: %s\n' "$windows_sha256"
          printf 'windows_sha256=%s\n' "$windows_sha256" >> "$GITHUB_OUTPUT"

  windows:
    needs: linux
    runs-on: blacksmith-2vcpu-windows-2025
    env:
      SANDBOXED_AGENTS_RELEASE_BASH: 'C:\Program Files\Git\bin\bash.exe'
      EXPECTED_ASSET_HASH: ${{ needs.linux.outputs.linux_asset_hash }}
      EXPECTED_LINUX_SHA256: ${{ needs.linux.outputs.linux_sha256 }}
      EXPECTED_WINDOWS_SHA256: ${{ needs.linux.outputs.windows_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify LF Go sources with Windows checkout settings and tag HEAD
        shell: pwsh
        run: |
          git config core.autocrlf true
          if ($LASTEXITCODE -ne 0) { throw 'Local CRLF configuration failed' }
          git read-tree --empty
          if ($LASTEXITCODE -ne 0) { throw 'CI index invalidation failed' }
          git -c core.autocrlf=true reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { throw 'CRLF checkout rematerialization failed' }
          $sources = Get-ChildItem -Recurse -Filter '*.go'
          if ($sources.Count -eq 0) { throw 'No Go sources found' }
          foreach ($source in $sources) {
            $contents = [System.IO.File]::ReadAllText($source.FullName)
            if ($contents.Contains("`r`n")) { throw "Go source contains CRLF: $($source.FullName)" }
          }
          $unformatted = @(gofmt -l .)
          if ($LASTEXITCODE -ne 0) { throw 'Go formatting check failed' }
          if ($unformatted.Count -ne 0) { throw "Go sources need formatting: $($unformatted -join ', ')" }
          git tag "v$env:RELEASE_VERSION" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Local CI tag failed' }
      - name: Run CLI and stable gate tests
        shell: pwsh
        run: |
          go test ./cmd/sandboxed-agents -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Windows command tests failed' }
          go test ./internal/cli ./internal/release/cmd/stable-gate -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Windows CLI or stable gate tests failed' }
      - name: Run image and release tests with Git for Windows Bash
        shell: pwsh
        env:
          SANDBOXED_AGENTS_TEST_HKCU: '1'
        run: |
          go test ./image ./scripts -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows image or release tests failed' }
      - name: Build releases and compare asset hash and both executable digests
        shell: pwsh
        run: |
          $outputDirectory = "$env:RUNNER_TEMP/release-output".Replace('\', '/')
          & $env:SANDBOXED_AGENTS_RELEASE_BASH scripts/release.sh $env:RELEASE_VERSION $outputDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed' }
          $versionOutput = & "$env:RUNNER_TEMP/release-output/sandboxed-agents-windows-amd64.exe" version
          if ($LASTEXITCODE -ne 0) { throw 'Windows version failed' }
          $versionOutput
          if ($versionOutput[0] -ne "sandboxed-agents $env:RELEASE_VERSION") { throw 'Injected Windows version differs' }
          $assetHash = ($versionOutput | Where-Object { $_ -match '^asset-sha256 ' }) -replace '^asset-sha256 ', ''
          if ($assetHash -ne $env:EXPECTED_ASSET_HASH) { throw 'Windows and Linux asset hashes differ' }
          $windowsSHA256 = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP/release-output/sandboxed-agents-windows-amd64.exe").Hash.ToLowerInvariant()
          "Windows executable SHA256: $windowsSHA256"
          if ($windowsSHA256 -ne $env:EXPECTED_WINDOWS_SHA256) { throw 'Windows-built and Linux-cross-compiled Windows executables differ' }
          $linuxSHA256 = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP/release-output/sandboxed-agents-linux-amd64").Hash.ToLowerInvariant()
          "Linux executable SHA256: $linuxSHA256"
          if ($linuxSHA256 -ne $env:EXPECTED_LINUX_SHA256) { throw 'Windows-cross-compiled and Linux-built Linux executables differ' }
